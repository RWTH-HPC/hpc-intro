  portal: "https://regapp.itc.rwth-aachen.de"
  host: "login23-1"
  node: "r23m0055"
  location: "hpc.itc.rwth-aachen.de"
  homedir: "/home"
  user: "ab123456"
  module_python3: "Python"
  prompt: "ab123456@login23-1:~$"
