sched:
  name: "Slurm"
  submit:
    name: "sbatch"
    options: ""
  queue:
    debug: "r23m0055"
    testing: "gloom"
  status: "squeue"
  flag:
    user: "-u $USER"
    interactive: ""
    histdetail: "-l -j"
    name: "-J"
    time: "-t"
    queue: "-p"
  del: "scancel"
  interactive: "salloc"
  info: "sinfo"
  comment: "#SBATCH"
  hist: "sacct -u $USER"
  hist_filter: ""

